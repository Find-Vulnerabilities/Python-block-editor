<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#2196F3"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Turtle shell -->
  <ellipse cx="256" cy="280" rx="140" ry="120" fill="#2E7D32" stroke="#1B5E20" stroke-width="8"/>
  <!-- Shell pattern -->
  <line x1="256" y1="160" x2="256" y2="400" stroke="#1B5E20" stroke-width="4"/>
  <line x1="116" y1="280" x2="396" y2="280" stroke="#1B5E20" stroke-width="4"/>
  <line x1="157" y1="195" x2="355" y2="365" stroke="#1B5E20" stroke-width="4"/>
  <line x1="355" y1="195" x2="157" y2="365" stroke="#1B5E20" stroke-width="4"/>
  <!-- Turtle head -->
  <circle cx="256" cy="130" r="50" fill="#4CAF50" stroke="#388E3C" stroke-width="6"/>
  <!-- Eyes -->
  <circle cx="235" cy="118" r="10" fill="white"/>
  <circle cx="277" cy="118" r="10" fill="white"/>
  <circle cx="238" cy="116" r="5" fill="#333"/>
  <circle cx="280" cy="116" r="5" fill="#333"/>
  <!-- Legs -->
  <rect x="100" y="230" width="40" height="60" rx="15" fill="#4CAF50" stroke="#388E3C" stroke-width="5"/>
  <rect x="372" y="230" width="40" height="60" rx="15" fill="#4CAF50" stroke="#388E3C" stroke-width="5"/>
  <rect x="130" y="360" width="40" height="50" rx="15" fill="#4CAF50" stroke="#388E3C" stroke-width="5"/>
  <rect x="342" y="360" width="40" height="50" rx="15" fill="#4CAF50" stroke="#388E3C" stroke-width="5"/>
  <!-- Py text -->
  <text x="256" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="60" fill="white">Py</text>
</svg>
